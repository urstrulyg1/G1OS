# G1OS EFI boot entries for Apple EFI 1.10 / iMac11,x
# Safe Graphics intentionally keeps the EFI framebuffer available.
set default=0
set timeout=8
insmod serial
insmod terminal
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod linux
insmod search

menuentry "G1OS (Safe Graphics - Default for iMac Mid-2010)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite init=/init rd.maclite=1 maclite.gl=off nomodeset radeon.modeset=0 video=efifb \
          fbcon=map:0 console=tty0 console=ttyS0 loglevel=7 ignore_loglevel initcall_debug \
          acpi_backlight=native reboot=pci panic=-1
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS (Safe Graphics + Verbose Debug)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite init=/init rd.maclite=1 maclite.gl=off radeon.modeset=1 \
          fbcon=map:0 console=tty0 console=ttyS0 loglevel=7 ignore_loglevel initcall_debug \
          acpi_backlight=native reboot=pci panic=-1
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS (Radeon KMS - Hardware Acceleration)" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite init=/init rd.maclite=1 mitigations=off \
          console=tty0 console=ttyS0 loglevel=7 ignore_loglevel initcall_debug acpi_backlight=native \
          radeon.modeset=1 radeon.uvd=1 b43.fwok=1 reboot=pci panic=-1
    initrd /boot/initrd-maclite.img
}

menuentry "G1OS Recovery Shell" {
    search --no-floppy --set=root --file /live/maclite-base.sqfs
    linux /boot/vmlinuz-maclite init=/init rd.maclite=recovery nomodeset radeon.modeset=0 \
          video=efifb fbcon=map:0 console=tty0 console=ttyS0 loglevel=7 ignore_loglevel initcall_debug \
          reboot=pci panic=-1
    initrd /boot/initrd-maclite.img
}
