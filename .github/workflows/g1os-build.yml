name: G1OS build and readiness gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete runs when a newer commit supersedes them.
concurrency:
  group: g1os-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and ISO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config bc bison flex libssl-dev libelf-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfreetype6-dev libudev-dev libx11-dev libasound2-dev \
            xorriso grub-efi-amd64-bin squashfs-tools cpio xz-utils \
            bzip2 file genisoimage shellcheck qemu-system-x86 \
            dosfstools mtools ovmf qemu-utils e2fsprogs util-linux

      - name: Clean generated boot artifacts
        working-directory: macliteos
        run: |
          set -eu
          rm -rf out/kernel-src out/kernel-build out/kernel-modules out/iso-stage
          rm -f out/vmlinuz-maclite out/initrd-maclite.img out/G1OS.iso out/G1OS.iso.sha256
          rm -f out/g1os-kernel-manifest.txt out/g1os-kernel.sha256 out/g1os-initrd-manifest.txt
          rm -f out/kernel-version.txt out/kernel-source.sha256 out/iso-manifest.txt out/iso-file-list.txt

      # Fail-fast prerequisite: no expensive compilation starts until shell checks pass.
      - name: Installation audit harness syntax
        working-directory: macliteos
        run: |
          set -eu
          sh -n scripts/audit-installation-contract.sh

      - name: Shell syntax and ShellCheck — init/boot
        working-directory: macliteos
        run: |
          set -eu
          sh -n boot/g1os-init
          shellcheck -s sh boot/g1os-init

      - name: Shell syntax and ShellCheck — installer backend
        working-directory: macliteos
        run: |
          set -eu
          sh -n installer/maclite-installer-backend
          shellcheck -s sh installer/maclite-installer-backend

      - name: Shell syntax and ShellCheck — all remaining scripts
        working-directory: macliteos
        run: |
          set -eu
          for f in $(find . -type f \( -name '*.sh' -o -path './installer/maclite-install' \)); do
            case "$f" in ./scripts/audit-installation-contract.sh) continue ;; esac
            sh -n "$f"
            shellcheck -s sh "$f"
          done


      - name: Clean userspace build
        working-directory: macliteos
        run: |
          set -eu
          make clean
          ./configure
          make -j"$(nproc)" all

      - name: Production userspace audit
        working-directory: macliteos
        run: |
          set -eu
          sh scripts/audit-production.sh

      - name: iMac Mid-2010 hardware compatibility gate
        working-directory: macliteos
        run: |
          set -eu
          python3 scripts/test_imac_mid2010_compatibility.py


      - name: Cursor trail end-to-end regression
        working-directory: macliteos
        run: |
          set -eu
          python3 scripts/test_cursor_trails.py

      - name: Installer logic regression
        working-directory: macliteos
        run: |
          set -eu
          python3 scripts/test_installer_logic.py

      - name: Full userspace runtime regression suite
        working-directory: macliteos
        run: |
          set -eu
          sh scripts/run-tests.sh


      - name: Kernel hardware contract preflight
        working-directory: macliteos
        run: |
          set -eu
          for setting in             CONFIG_DRM_RADEON=m CONFIG_SATA_AHCI=y CONFIG_USB_EHCI_HCD=y             CONFIG_USB_OHCI_HCD=y CONFIG_USB_STORAGE=y             CONFIG_EFI_STUB=y CONFIG_FB_EFI=y CONFIG_FRAMEBUFFER_CONSOLE=y             CONFIG_EXT4_FS=y CONFIG_VFAT_FS=y; do
            grep -qx "$setting" kernel/g1os-x86_64.fragment
          done
          for driver in CONFIG_DRM_RADEON CONFIG_HID_APPLE CONFIG_TIGON3 CONFIG_B43 CONFIG_SND_HDA_INTEL; do
            grep -Eq "^$driver=(y|m)$" kernel/g1os-x86_64.fragment
          done

      - name: Build G1OS kernel
        working-directory: macliteos
        run: |
          set -euo pipefail
          export G1OS_JOBS=2
          LOG="$PWD/out/kernel-build.log"
          rm -f "$LOG"
          if sh scripts/build-kernel.sh 2>&1 | tee "$LOG"; then
            true
          else
            rc=${PIPESTATUS[0]}
            {
              echo "## Kernel build failure diagnostics"
              echo ""
              echo '```text'
              tail -160 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          test -s out/vmlinuz-maclite
          test -s out/g1os-kernel-manifest.txt
          grep -F "G1OS_KERNEL_MANIFEST=1" out/g1os-kernel-manifest.txt >/dev/null
          grep -F "artifact_arch=x86_64" out/g1os-kernel-manifest.txt >/dev/null
          grep -F "artifact_format=x86_64-bzImage" out/g1os-kernel-manifest.txt >/dev/null

      - name: Upload kernel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G1OS-kernel-failure-diagnostics
          if-no-files-found: ignore
          path: |
            macliteos/out/kernel-build.log
            macliteos/out/kernel-build/.config

      - name: Build initramfs
        working-directory: macliteos
        run: |
          set -eu
          sh scripts/build-busybox.sh
          G1OS_BUSYBOX="$PWD/out/busybox" \
          G1OS_KERNEL_MODULES="$PWD/out/kernel-modules" \
            sh scripts/make-initrd.sh "$PWD/out/initrd-maclite.img"
          sh scripts/validate-boot-artifacts.sh "$PWD/out/initrd-maclite.img"

      - name: Assemble and independently verify ISO
        working-directory: macliteos
        run: |
          set -eu
          G1OS_KERNEL="$PWD/out/vmlinuz-maclite" \
          G1OS_INITRD="$PWD/out/initrd-maclite.img" \
            sh scripts/make-iso.sh --verify
          sh scripts/validate-boot-artifacts.sh "$PWD/out/initrd-maclite.img" "$PWD/out/G1OS.iso"
          sh scripts/audit-production.sh "$PWD/out/G1OS.iso"
          test -s out/G1OS.iso
          test -s out/G1OS.iso.sha256
          test -s out/iso-manifest.txt
          test -s out/iso-file-list.txt
          grep -F "boot/g1os-kernel-manifest.txt" out/iso-file-list.txt >/dev/null
          grep -F "boot/g1os-initrd-manifest.txt" out/iso-file-list.txt >/dev/null
          grep -F "boot/g1os-boot-manifest.txt" out/iso-file-list.txt >/dev/null

      - name: Failure-injection and artifact integrity tests
        working-directory: macliteos
        run: |
          set -eu
          TMP="$PWD/out/ci-tamper"
          rm -rf "$TMP"
          mkdir -p "$TMP"

          # The validator must reject a corrupted initramfs rather than silently
          # accepting a damaged boot artifact.
          cp out/initrd-maclite.img "$TMP/initrd-corrupt.img"
          printf 'G1OS-CI-CORRUPTION' | dd of="$TMP/initrd-corrupt.img" bs=1 seek=64 conv=notrunc status=none
          if sh scripts/validate-boot-artifacts.sh "$TMP/initrd-corrupt.img" >/dev/null 2>&1; then
            echo "ERROR: corrupted initramfs was accepted." >&2
            exit 1
          fi
          echo "PASS: corrupted initramfs rejected."

          # ISO checksum must be independently verifiable.
          sha256sum -c out/G1OS.iso.sha256 >/dev/null
          echo "PASS: ISO checksum verified."

          # The authoritative manifest must agree with the exact artifacts.
          KERNEL_SHA="$(sha256sum out/vmlinuz-maclite | cut -d' ' -f1)"
          INITRD_SHA="$(sha256sum out/initrd-maclite.img | cut -d' ' -f1)"
          grep -F "artifact_sha256=$KERNEL_SHA" out/g1os-kernel-manifest.txt >/dev/null
          grep -F "artifact_sha256=$INITRD_SHA" out/g1os-initrd-manifest.txt >/dev/null
          echo "PASS: kernel/initramfs manifests match exact artifacts."

          # Ensure the release image does not accidentally contain development
          # staging trees or host-specific absolute paths.
          if grep -F "/base/" out/iso-file-list.txt >/dev/null; then
            echo "ERROR: ISO contains leaked /base staging tree." >&2
            exit 1
          fi
          if grep -E '/(home|Users)/[^/]+/' out/iso-file-list.txt >/dev/null; then
            echo "ERROR: ISO file list contains host-specific absolute paths." >&2
            exit 1
          fi
          echo "PASS: ISO has no leaked staging/host paths."

      - name: Installation contract static safety audit
        working-directory: macliteos
        run: |
          set -eu
          sh scripts/audit-installation-contract.sh --static-only out/G1OS.iso

      - name: Installer backend synthetic state-machine test
        working-directory: macliteos
        timeout-minutes: 2
        run: |
          set -eu
          LOG="$PWD/out/ci-installer-dryrun.log"
          rm -f "$LOG"
          timeout 45s sh installer/maclite-installer-backend --target /dev/g1os-ci-dryrun --dry-run --json >"$LOG" 2>&1
          for state in PREPARING INSTALLING FINALIZING VERIFYING COMPLETED; do
            grep -F '"state":"'"$state"'"' "$LOG" >/dev/null
          done
          ! grep -F '"state":"FAILED"' "$LOG" >/dev/null
          grep -F '"progress":100' "$LOG" >/dev/null
          grep -F '"synthetic":true' "$LOG" >/dev/null
          if sh installer/maclite-installer-backend --target '../escape' --dry-run >/dev/null 2>&1; then
            echo "ERROR: path traversal target accepted" >&2
            exit 1
          fi
          if sh installer/maclite-installer-backend --unknown-option >/dev/null 2>&1; then
            echo "ERROR: unknown option accepted" >&2
            exit 1
          fi
          echo "PASS: synthetic installer state machine and fail-closed argument tests"



      - name: Real disk installation integration test (UEFI QEMU)
        working-directory: macliteos
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DISK="$PWD/out/ci-install-disk.raw"
          MARKER="$PWD/out/ci-install-marker.raw"
          LOG="$PWD/out/qemu-real-install.log"
          rm -f "$DISK" "$MARKER" "$LOG"
          qemu-img create -f raw "$DISK" 12G
          qemu-img create -f raw "$MARKER" 32M
          mkfs.ext4 -F -L G1OS_CI "$MARKER" >/dev/null

          cleanup() {
            if [ -n "${LOOP_DEV:-}" ]; then
              sudo umount /mnt/g1os-ci-root 2>/dev/null || true
              sudo umount /mnt/g1os-ci-efi 2>/dev/null || true
              sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
            fi
            rm -f "$DISK" "$MARKER"
          }
          trap cleanup EXIT HUP INT TERM

          # Boot the real ISO under UEFI with a completely blank virtual target.
          # The marker disk opts the initrd into CI mode; the blank disk is the
          # actual installation target. No host disk can be touched.
          set +e
          timeout 240s qemu-system-x86_64             -machine q35,accel=tcg             -m 4096             -smp 2             -vga std             -bios /usr/share/OVMF/OVMF_CODE_4M.fd             -drive format=raw,file="$DISK",if=virtio             -drive format=raw,file="$MARKER",if=virtio             -drive format=raw,file=out/G1OS.iso,if=ide,media=cdrom             -boot d             -serial stdio             -display none             -no-reboot             2>&1 | tee "$LOG"
          QEMU_RC=${PIPESTATUS[0]}
          set -e
          [ "$QEMU_RC" -eq 0 ] || [ "$QEMU_RC" -eq 124 ] || {
            echo "ERROR: real installation VM failed with exit code $QEMU_RC" >&2
            exit "$QEMU_RC"
          }
          grep -F "CI real installation backend completed successfully" "$LOG" >/dev/null
          grep -F "CI installation reached authoritative COMPLETED state" "$LOG" >/dev/null
          grep -F "CI installation disk synchronized; integration test complete" "$LOG" >/dev/null

          # Independently inspect the disk produced by the real installer.
          LOOP_DEV="$(sudo losetup --find --show --partscan "$DISK")"
          sudo udevadm settle --timeout=5 || true
          sudo mkdir -p /mnt/g1os-ci-efi /mnt/g1os-ci-root
          sudo mount -o ro "${LOOP_DEV}p1" /mnt/g1os-ci-efi
          sudo mount -o ro "${LOOP_DEV}p3" /mnt/g1os-ci-root
          test -s /mnt/g1os-ci-efi/EFI/BOOT/BOOTX64.EFI
          test -s /mnt/g1os-ci-efi/EFI/BOOT/grub.cfg
          test -s /mnt/g1os-ci-efi/boot/vmlinuz-g1os
          test -s /mnt/g1os-ci-efi/boot/initrd-g1os.img
          test -s /mnt/g1os-ci-efi/boot/g1os-boot-manifest.txt
          test -s /mnt/g1os-ci-root/etc/g1os-installed
          test -s /mnt/g1os-ci-root/etc/fstab
          grep -F "G1OS_BUILD_ID=" /mnt/g1os-ci-root/etc/g1os-installed >/dev/null
          grep -F "/var/data" /mnt/g1os-ci-root/etc/fstab >/dev/null
          grep -F "root=UUID=" /mnt/g1os-ci-efi/EFI/BOOT/grub.cfg >/dev/null
          grep -F "initrd /boot/initrd-g1os.img" /mnt/g1os-ci-efi/EFI/BOOT/grub.cfg >/dev/null
          umount /mnt/g1os-ci-root
          umount /mnt/g1os-ci-efi
          sudo losetup -d "$LOOP_DEV"
          LOOP_DEV=""

          # Second boot is from the installed disk only. This validates the
          # actual installed UEFI -> GRUB -> kernel -> initramfs -> root/data
          # resolution path, rather than only validating the live ISO.
          set +e
          timeout 180s qemu-system-x86_64             -machine q35,accel=tcg             -m 4096             -smp 2             -vga std             -bios /usr/share/OVMF/OVMF_CODE_4M.fd             -drive format=raw,file="$DISK",if=virtio             -serial stdio             -display none             -no-reboot             2>&1 | tee -a "$LOG"
          QEMU_BOOT_RC=${PIPESTATUS[0]}
          set -e
          grep -F "Installed root filesystem verified" "$LOG" >/dev/null
          grep -F "Persistent data filesystem mounted" "$LOG" >/dev/null
          grep -F "Starting installed G1OS compositor" "$LOG" >/dev/null
          if grep -Eiq "kernel panic|kernel BUG|cannot mount installed root|persistent data filesystem.*could not be resolved|real G1OS kernel image not found|initramfs.*not found" "$LOG"; then
            echo "ERROR: installed-boot integration log contains a fatal boot/install error." >&2
            exit 1
          fi
          [ "$QEMU_BOOT_RC" -eq 0 ] || [ "$QEMU_BOOT_RC" -eq 124 ] || {
            echo "ERROR: installed-disk UEFI boot failed with exit code $QEMU_BOOT_RC" >&2
            exit "$QEMU_BOOT_RC"
          }
          echo "PASS: real ISO installation + installed-disk UEFI boot integration test completed."
          echo "PASS: no host disk was used; target was isolated QEMU virtual storage."

      - name: Boot ISO under real UEFI QEMU and require graphical installer readiness
        working-directory: macliteos
        run: |
          set -eu
          timeout 60s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 2048 \
            -smp 2 \
            -vga std \
            -bios /usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive format=raw,file=out/G1OS.iso,if=ide,media=cdrom \
            -boot d \
            -serial stdio \
            -display none \
            -no-reboot \
            2>&1 | tee out/qemu-uefi-console.log || rc=$?
          rc=${rc:-0}
          if grep -F "Graphical installer ready: compositor responsive and installer surface present" out/qemu-uefi-console.log >/dev/null; then
            echo "PASS: QEMU UEFI reached the real graphical installer health gate."
          elif grep -qi "panic\|kernel BUG\|\[FAIL\]" out/qemu-uefi-console.log; then
            echo "ERROR: QEMU UEFI boot reported a kernel/init/graphics failure." >&2
            exit 1
          else
            echo "ERROR: QEMU UEFI boot did not prove graphical installer readiness." >&2
            tail -200 out/qemu-uefi-console.log >&2 || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || exit "$rc"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G1OS-build
          path: |
            macliteos/out/G1OS.iso
            macliteos/out/G1OS.iso.sha256
            macliteos/out/iso-manifest.txt
            macliteos/out/iso-file-list.txt
            macliteos/out/vmlinuz-maclite
            macliteos/out/initrd-maclite.img
            macliteos/out/kernel-version.txt
            macliteos/out/kernel-source.sha256
            macliteos/out/g1os-kernel-manifest.txt
            macliteos/out/g1os-kernel.sha256
            macliteos/out/g1os-initrd-manifest.txt
            macliteos/out/qemu-uefi-console.log
